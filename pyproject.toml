[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reliabilitygraph"
version = "0.1.0"
description = "Evidence-grounded incident intelligence for distributed systems"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
app = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
  "pyright==1.1.398",
  "pytest==8.3.5",
  "ruff==0.11.2",
  "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reliabilitygraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
